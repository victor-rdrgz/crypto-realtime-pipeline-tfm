name: Feature request
description: Propose a new capability or an improvement.
labels:
  - enhancement
body:
  - type: textarea
    id: purpose
    attributes:
      label: Purpose
      description: The problem this solves and who benefits from it.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change. Link an ADR if the change needs a design decision.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Verifiable conditions that mark the work as done.
      placeholder: |
        - [ ] ...
    validations:
      required: true

name: Design question
description: Open a question about direction or design before writing an ADR.
labels:
  - question
body:
  - type: textarea
    id: question
    attributes:
      label: Question
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: The constraints, the options considered and any relevant documentation.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected outcome
      description: What answering this question should produce, for example an ADR or a set of issues.
    validations:
      required: true
